<!doctype html>
<html><head>
<title>AcxiomCRM Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head><body class="bg-light">
<div class="container py-4">
<h1>AcxiomCRM Dashboard</h1>
<p class="text-muted">Django reporting UI → Spring Boot REST API → MySQL</p>
<div class="row g-3">
{% for key,value in data.items %}
<div class="col-md-3"><div class="card shadow-sm"><div class="card-body">
<h6 class="text-muted">{{ key }}</h6><h3>{{ value }}</h3>
</div></div></div>
{% endfor %}
</div>
<hr>
<div class="d-flex gap-2 flex-wrap">
<a class="btn btn-primary" href="/customers/">Customers</a>
<a class="btn btn-success" href="/leads/">Leads</a>
<a class="btn btn-warning" href="/opportunities/">Opportunities</a>
<a class="btn btn-info" href="/followups/">Follow-Ups</a>
</div>
</div></body></html>
